<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gniazdo Nostalgii vs Przeciwnik</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            display: inline-block;
        }
        canvas {
            background-color: #e0e0e0;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }
        .player-info {
            display: flex;
            flex-direction: column;
        }
        .player-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
            text-shadow: 1px 1px 0px #fff;
        }
        .health-bar-bg {
            width: 300px;
            height: 30px;
            background: #d32f2f;
            border: 3px solid #333;
            border-radius: 5px;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .health-bar-fill {
            height: 100%;
            background: #4caf50;
            width: 100%;
            transition: width 0.15s ease-out;
        }
        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 56px;
            font-weight: bold;
            color: #333;
            text-shadow: 2px 2px 0 #fff;
            display: none;
            z-index: 20;
            text-align: center;
        }
        
        #legend {
            margin-top: 20px;
            background: #333;
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            text-align: center;
        }
        #legend h3 {
            margin: 0 0 10px 0;
            color: #ffca28;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }
        kbd {
            background-color: #eee;
            border-radius: 4px;
            border: 1px solid #b4b4b4;
            box-shadow: 0 2px 0 0 #b4b4b4, 0 3px 2px 0 rgba(0,0,0,0.4);
            color: #333;
            display: inline-block;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 8px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div class="player-info">
                <div class="player-name">Gniazdo Nostalgii</div>
                <div class="health-bar-bg">
                    <div id="playerHealth" class="health-bar-fill"></div>
                </div>
            </div>
            <div class="player-info" style="align-items: flex-end;">
                <div class="player-name">Przeciwnik</div>
                <div class="health-bar-bg" style="display: flex; justify-content: flex-end;">
                    <div id="enemyHealth" class="health-bar-fill"></div>
                </div>
            </div>
        </div>
        <div id="result">Koniec Gry</div>
        <canvas id="gameCanvas" width="1024" height="576"></canvas>
    </div>

    <div id="legend">
        <h3>Legenda Sterowania</h3>
        <div class="controls-grid">
            <div class="control-item"><kbd>A</kbd> <kbd>D</kbd> Ruch</div>
            <div class="control-item"><kbd>W</kbd> lub <kbd>Spacja</kbd> Skok</div>
            <div class="control-item"><kbd>K</kbd> Szybki Atak (5 DMG)</div>
            <div class="control-item"><kbd>L</kbd> Mocny Atak (15 DMG)</div>
            <div class="control-item"><kbd>R</kbd> Reset Gry</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gravity = 0.7;

        // Limiter FPS
        const fps = 60;
        const fpsInterval = 1000 / fps;
        let then = performance.now();

        // Dźwięki
        const sndAttack = new Audio('attack1.mp3');
        const sndFinish = new Audio('finish.mp3');
        const sndFatality = new Audio('fatality.mp3');

        function playSound(audioObj) {
            const sound = audioObj.cloneNode();
            sound.play().catch(e => console.log('Brak interakcji: wyciszono dźwięk'));
        }

        // Twarz wroga
        const enemyFace = new Image();
        enemyFace.src = 'image_fa6dc5.png';

        let particles = [];

        // Rysowanie Miecza (Canvas API)
        function drawSword(ctx, x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Delikatny cień
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            // Ostrze
            ctx.fillStyle = '#cfd8dc'; // jasne srebro
            ctx.strokeStyle = '#78909c'; // ciemne srebro
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-4, 0);
            ctx.lineTo(-3, -70);
            ctx.lineTo(0, -85); // ostry czubek
            ctx.lineTo(3, -70);
            ctx.lineTo(4, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Zbrocze (rowek na środku)
            ctx.strokeStyle = '#90a4ae';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(0, -65);
            ctx.stroke();

            // Jelec (Crossguard)
            ctx.fillStyle = '#ffb300'; // złoto
            ctx.strokeStyle = '#b08d00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-15, -2);
            ctx.lineTo(15, -2);
            ctx.lineTo(12, 4);
            ctx.lineTo(-12, 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Rękojeść
            ctx.fillStyle = '#5d4037'; // brązowa skóra
            ctx.strokeStyle = '#3e2723';
            ctx.beginPath();
            ctx.rect(-3, 4, 6, 16);
            ctx.fill();
            ctx.stroke();

            // Głowica (Pommel)
            ctx.fillStyle = '#ffb300';
            ctx.beginPath();
            ctx.arc(0, 23, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        // Generowanie iskier podczas trafienia
        function spawnImpact(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(
                    x + (Math.random() - 0.5) * 20,
                    y + (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 15,
                    (Math.random() - 0.5) * 15,
                    'spark',
                    '#ffea00' // Jasny żółty
                ));
            }
        }

        class Particle {
            constructor(x, y, vx, vy, type, color, faceImg = null) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.type = type; this.color = color; this.faceImg = faceImg;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.4;
                
                if (type === 'blood') {
                    this.size = Math.random() * 5 + 3;
                } else if (type === 'spark') {
                    this.maxLife = Math.random() * 15 + 10;
                    this.life = this.maxLife;
                    this.size = Math.random() * 4 + 2;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.type === 'spark') {
                    this.life--;
                    this.vy += gravity * 0.5; // Iskry wolniej opadają
                    this.size *= 0.93; // Zmniejszają się
                } else if (this.y < canvas.height - 50) {
                    this.vy += gravity;
                    this.rotation += this.rotSpeed;
                } else {
                    this.y = canvas.height - 50;
                    this.vy = 0;
                    this.vx *= 0.5;
                    this.rotSpeed = 0;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                if (this.type === 'blood') {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'spark') {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                } else {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    if (this.type === 'head') {
                        if (this.faceImg && this.faceImg.complete) {
                            ctx.drawImage(this.faceImg, -30, -30, 60, 60);
                        } else {
                            ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.stroke();
                        }
                    } else {
                        ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }

        class Sprite {
            constructor({ position, velocity, color, isEnemy = false }) {
                this.position = position;
                this.velocity = velocity;
                this.width = 50;
                this.height = 150;
                this.lastKey = '';
                this.attackBox = { position: { x: this.position.x, y: this.position.y }, width: 100, height: 50 };
                this.color = color;
                
                // Zmienne do nowej animacji ataku
                this.isAttacking = false;
                this.attackType = 0;
                this.attackProgress = 0; 
                this.attackSpeed = 0; 
                this.attackDealtDamage = false; 

                this.health = 100;
                this.isEnemy = isEnemy;
                this.facingRight = !isEnemy;
                this.awaitingFatality = false;
                this.shattered = false;
            }

            shatter() {
                this.shattered = true;
                const cx = this.position.x + this.width / 2;
                const cy = this.position.y;
                
                particles.push(new Particle(cx, cy+20, (Math.random()-0.5)*15, -Math.random()*15 - 5, 'head', this.color, this.isEnemy ? enemyFace : null));
                particles.push(new Particle(cx, cy+60, (Math.random()-0.5)*15, -Math.random()*15, 'limb', this.color));
                particles.push(new Particle(cx-15, cy+70, (Math.random()-0.5)*15, -Math.random()*15, 'limb', this.color));
                particles.push(new Particle(cx+15, cy+70, (Math.random()-0.5)*15, -Math.random()*15, 'limb', this.color));
                particles.push(new Particle(cx-15, cy+110, (Math.random()-0.5)*15, -Math.random()*15, 'limb', this.color));
                particles.push(new Particle(cx+15, cy+110, (Math.random()-0.5)*15, -Math.random()*15, 'limb', this.color));

                for(let i = 0; i < 50; i++) {
                    particles.push(new Particle(
                        cx + (Math.random() - 0.5) * 40, cy + 50 + (Math.random() - 0.5) * 80, 
                        (Math.random() - 0.5) * 25, -Math.random() * 20, 
                        'blood', '#b71c1c'
                    ));
                }
            }

            drawStickman() {
                if (this.shattered) return; 

                ctx.strokeStyle = this.color;
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const cx = this.position.x + this.width / 2;
                const cy = this.position.y;
                const dir = this.facingRight ? 1 : -1;

                // Twarz / Głowa
                if (this.isEnemy && enemyFace.complete) {
                    const faceSize = 60;
                    ctx.drawImage(enemyFace, cx - faceSize / 2, cy - 15, faceSize, faceSize);
                } else {
                    ctx.beginPath();
                    ctx.arc(cx, cy + 20, 15, 0, Math.PI * 2);
                    ctx.stroke();
                }

                let dropArm = this.awaitingFatality ? 30 : 0;

                // Tułów i nogi
                ctx.beginPath(); ctx.moveTo(cx, cy + 35); ctx.lineTo(cx, cy + 90); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx, cy + 90); ctx.lineTo(cx - 15, cy + 140); 
                ctx.moveTo(cx, cy + 90); ctx.lineTo(cx + 15, cy + 140); 
                ctx.stroke();

                // Animacja rąk i miecza
                const armY = cy + 50;
                let handX = cx + dir * 30;
                let handY = cy + 60 + dropArm;
                let swordAngle = dir * (Math.PI / 4); // Domyślnie lekko do przodu/góry
                
                if (this.isAttacking && !this.awaitingFatality) {
                    const p = this.attackProgress; // Postęp od 0 do 1

                    if (this.attackType === 1) {
                        // Szybki atak - pchnięcie
                        handX = cx + dir * (30 + Math.sin(p * Math.PI) * 50);
                        handY = cy + 50;
                        swordAngle = dir * (Math.PI / 2); // Miecz poziomo
                    } else if (this.attackType === 2) {
                        // Mocny atak - zamach znad głowy
                        handX = cx + dir * (30 + Math.sin(p * Math.PI) * 40);
                        handY = cy + 60 - Math.sin(p * Math.PI) * 30;
                        // Płynna zmiana kąta z tyłu do przodu
                        swordAngle = dir * (-Math.PI/4 + p * Math.PI * 1.5);
                    }
                }

                // Rysowanie rąk
                ctx.beginPath();
                ctx.moveTo(cx, armY); 
                ctx.lineTo(handX, handY); 
                ctx.stroke();

                // Rysowanie miecza (jeśli nie jest oszołomiony)
                if (!this.awaitingFatality) {
                    drawSword(ctx, handX, handY, swordAngle);
                }
            }

            update() {
                this.drawStickman();
                if (this.shattered) return;

                // Mechanika postępu animacji ataku (Animation Lock)
                if (this.isAttacking) {
                    this.attackProgress += this.attackSpeed;
                    if (this.attackProgress >= 1) {
                        this.isAttacking = false;
                        this.attackProgress = 0;
                    }
                }

                if (this.awaitingFatality) {
                    this.position.x += Math.sin(Date.now() / 150) * 1.5;
                }

                this.attackBox.position.x = this.facingRight ? this.position.x + this.width / 2 : this.position.x + this.width / 2 - this.attackBox.width;
                this.attackBox.position.y = this.position.y + 30;

                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                if (this.position.y + this.height + this.velocity.y >= canvas.height - 50) {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - 50 - this.height;
                } else {
                    this.velocity.y += gravity;
                }

                // Granice ekranu
                if (this.position.x < 0) this.position.x = 0;
                if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;
            }

            attack(type) {
                // Zabezpieczenie przed "spamowaniem" (Animation Lock)
                if (this.isAttacking || this.awaitingFatality || this.shattered) return;
                
                playSound(sndAttack); 
                this.isAttacking = true;
                this.attackType = type;
                this.attackProgress = 0;
                this.attackDealtDamage = false; // Reset flagi trafienia
                this.attackBox.width = type === 1 ? 120 : 160;
                
                // Prędkość animacji: typ 1 szybszy, typ 2 wolniejszy
                this.attackSpeed = type === 1 ? 0.08 : 0.04;
            }

            takeHit(damage) {
                if (this.health > 0) {
                    this.health -= damage;
                    if (this.health <= 0) this.health = 0;
                }
            }
        }

        const player = new Sprite({ position: { x: 200, y: 0 }, velocity: { x: 0, y: 0 }, color: '#1e88e5' });
        const enemy = new Sprite({ position: { x: 750, y: 0 }, velocity: { x: 0, y: 0 }, color: '#e53935', isEnemy: true });

        const keys = { a: { pressed: false }, d: { pressed: false }, w: { pressed: false }, space: { pressed: false } };

        function rectangularCollision({ rectangle1, rectangle2 }) {
            return (
                rectangle1.attackBox.position.x + rectangle1.attackBox.width >= rectangle2.position.x &&
                rectangle1.attackBox.position.x <= rectangle2.position.x + rectangle2.width &&
                rectangle1.attackBox.position.y + rectangle1.attackBox.height >= rectangle2.position.y &&
                rectangle1.attackBox.position.y <= rectangle2.position.y + rectangle2.height
            );
        }

        let gameOver = false;

        function determineWinner(isFatality = false) {
            const res = document.getElementById('result');
            res.style.display = 'block';
            
            if (player.health === enemy.health) {
                res.innerHTML = 'REMIS';
                res.style.color = '#333';
            } else if (player.health > enemy.health) {
                res.innerHTML = isFatality ? 'FATALITY!<br><span style="font-size:32px;">GNIAZDO NOSTALGII WYGRYWA</span>' : 'GNIAZDO NOSTALGII WYGRYWA!';
                res.style.color = isFatality ? '#b71c1c' : '#333';
            } else {
                res.innerHTML = isFatality ? 'FATALITY!<br><span style="font-size:32px;">PRZEGRAŁEŚ</span>' : 'PRZEGRAŁEŚ!';
                res.style.color = isFatality ? '#b71c1c' : '#333';
            }
            gameOver = true;
        }

        function resetGame() {
            player.health = 100; enemy.health = 100;
            player.position = { x: 200, y: 0 }; enemy.position = { x: 750, y: 0 };
            player.shattered = false; enemy.shattered = false;
            player.awaitingFatality = false; enemy.awaitingFatality = false;
            player.isAttacking = false; enemy.isAttacking = false;
            player.velocity = {x: 0, y: 0}; enemy.velocity = {x: 0, y: 0};
            particles = [];
            
            document.getElementById('playerHealth').style.width = '100%';
            document.getElementById('enemyHealth').style.width = '100%';
            document.getElementById('result').style.display = 'none';
            
            if (gameOver) {
                gameOver = false;
                then = performance.now(); 
                animate();
            }
        }

        function handleHit(attacker, victim, damage) {
            if (victim.shattered) return;

            if (victim.awaitingFatality) {
                victim.shatter();
                playSound(sndFatality);
                determineWinner(true);
            } else {
                victim.takeHit(damage);
                document.getElementById(victim === enemy ? 'enemyHealth' : 'playerHealth').style.width = victim.health + '%';
                
                if (victim.health <= 0) {
                    victim.awaitingFatality = true;
                    // Przerwij aktualne ataki ofiary
                    victim.isAttacking = false; 
                    playSound(sndFinish);
                    
                    const res = document.getElementById('result');
                    res.style.display = 'block';
                    res.innerHTML = 'FINISH HIM!';
                    res.style.color = '#b71c1c';
                }
            }
        }

        function updateAI() {
            if (enemy.shattered || player.shattered || gameOver) {
                enemy.velocity.x = 0;
                return;
            }
            if (enemy.awaitingFatality) {
                enemy.velocity.x = 0; 
                return;
            }

            const distanceX = player.position.x - enemy.position.x;
            enemy.facingRight = distanceX > 0;

            if (!player.awaitingFatality) {
                if (Math.abs(distanceX) > 120) enemy.velocity.x = distanceX > 0 ? 3 : -3;
                else enemy.velocity.x = 0;
                
                if (Math.random() < 0.02 && enemy.velocity.y === 0) enemy.velocity.y = -15;

                if (Math.abs(distanceX) < 140 && !enemy.isAttacking) {
                    if (Math.random() < 0.05) enemy.attack(Math.random() > 0.5 ? 1 : 2);
                }
            } else {
                enemy.velocity.x = 0;
                if (Math.abs(distanceX) < 130 && Math.random() < 0.01) enemy.attack(2);
                else if (Math.abs(distanceX) > 130) enemy.velocity.x = distanceX > 0 ? 3 : -3;
            }
        }

        function animate(now) {
            if (gameOver && particles.length === 0) return;
            window.requestAnimationFrame(animate);

            if (!now) now = performance.now();
            const elapsed = now - then;

            if (elapsed > fpsInterval) {
                then = now - (elapsed % fpsInterval); 

                ctx.fillStyle = '#e0e0e0'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#9e9e9e'; ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

                // Aktualizacja i usuwanie martwych iskier
                particles = particles.filter(p => p.type !== 'spark' || p.life > 0);
                particles.forEach(p => { p.update(); p.draw(); });

                player.update();
                enemy.update();

                player.facingRight = player.position.x < enemy.position.x;
                if (!enemy.isEnemy) enemy.facingRight = enemy.position.x < player.position.x;

                player.velocity.x = 0;
                if (!player.awaitingFatality && !player.shattered) {
                    if (keys.a.pressed && player.lastKey === 'a') player.velocity.x = -5;
                    else if (keys.d.pressed && player.lastKey === 'd') player.velocity.x = 5;
                }

                updateAI();

                // Sprawdzanie kolizji tylko podczas "aktywnych klatek" (środek animacji)
                [ {attacker: player, victim: enemy}, {attacker: enemy, victim: player} ].forEach(pair => {
                    const a = pair.attacker;
                    const v = pair.victim;
                    
                    if (a.isAttacking && !a.attackDealtDamage && a.attackProgress > 0.3 && a.attackProgress < 0.7) {
                        if (rectangularCollision({ rectangle1: a, rectangle2: v })) {
                            a.attackDealtDamage = true; // Zabezpieczenie przed wielokrotnym trafieniem
                            
                            // Efekt uderzenia
                            if (!v.awaitingFatality) spawnImpact(v.position.x + v.width/2, v.position.y + 60);
                            
                            handleHit(a, v, a.attackType === 1 ? 5 : 15);
                        }
                    }
                });
            }
        }

        window.requestAnimationFrame(animate);

        window.addEventListener('keydown', (event) => {
            switch (event.key.toLowerCase()) {
                case 'r': resetGame(); break;
                case 'd': if (!player.awaitingFatality && !gameOver) { keys.d.pressed = true; player.lastKey = 'd'; } break;
                case 'a': if (!player.awaitingFatality && !gameOver) { keys.a.pressed = true; player.lastKey = 'a'; } break;
                case 'w':
                case ' ': if (!player.awaitingFatality && !gameOver && player.velocity.y === 0) player.velocity.y = -15; break;
                case 'k': if (!player.awaitingFatality && !gameOver) player.attack(1); break;
                case 'l': if (!player.awaitingFatality && !gameOver) player.attack(2); break;
            }
        });

        window.addEventListener('keyup', (event) => {
            switch (event.key.toLowerCase()) {
                case 'd': keys.d.pressed = false; break;
                case 'a': keys.a.pressed = false; break;
            }
        });
    </script>
</body>
</html>
