<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gniazdo Nostalgii vs Przeciwnik</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            display: inline-block;
        }
        canvas {
            background-color: #e0e0e0;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
        }
        .player-info {
            display: flex;
            flex-direction: column;
        }
        .player-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
            text-shadow: 1px 1px 0px #fff;
        }
        .health-bar-bg {
            width: 300px;
            height: 30px;
            background: #d32f2f;
            border: 3px solid #333;
            border-radius: 5px;
            position: relative;
        }
        .health-bar-fill {
            height: 100%;
            background: #4caf50;
            width: 100%;
            transition: width 0.1s linear;
        }
        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #333;
            text-shadow: 2px 2px 0 #fff;
            display: none;
            z-index: 20;
        }
        
        /* Stylizacja nowej legendy */
        #legend {
            margin-top: 20px;
            background: #333;
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            text-align: center;
        }
        #legend h3 {
            margin: 0 0 10px 0;
            color: #ffca28;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }
        kbd {
            background-color: #eee;
            border-radius: 4px;
            border: 1px solid #b4b4b4;
            box-shadow: 0 2px 0 0 #b4b4b4, 0 3px 2px 0 rgba(0,0,0,0.4);
            color: #333;
            display: inline-block;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 8px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div class="player-info">
                <div class="player-name">Gniazdo Nostalgii</div>
                <div class="health-bar-bg">
                    <div id="playerHealth" class="health-bar-fill"></div>
                </div>
            </div>
            <div class="player-info" style="align-items: flex-end;">
                <div class="player-name">Przeciwnik</div>
                <div class="health-bar-bg" style="display: flex; justify-content: flex-end;">
                    <div id="enemyHealth" class="health-bar-fill"></div>
                </div>
            </div>
        </div>
        <div id="result">Koniec Gry</div>
        <canvas id="gameCanvas" width="1024" height="576"></canvas>
    </div>

    <!-- Nowa Legenda -->
    <div id="legend">
        <h3>Legenda Sterowania</h3>
        <div class="controls-grid">
            <div class="control-item">
                <kbd>A</kbd> <kbd>D</kbd> Ruch
            </div>
            <div class="control-item">
                <kbd>W</kbd> lub <kbd>Spacja</kbd> Skok
            </div>
            <div class="control-item">
                <kbd>K</kbd> Szybki Atak (5 DMG)
            </div>
            <div class="control-item">
                <kbd>L</kbd> Mocny Atak (15 DMG)
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gravity = 0.7;

        // Ładowanie twarzy przeciwnika ze wskazanego pliku
        const enemyFace = new Image();
        enemyFace.src = 'image_fa6dc5.png';

        class Sprite {
            constructor({ position, velocity, color, isEnemy = false }) {
                this.position = position;
                this.velocity = velocity;
                this.width = 50;
                this.height = 150;
                this.lastKey = '';
                this.attackBox = {
                    position: { x: this.position.x, y: this.position.y },
                    width: 100,
                    height: 50
                };
                this.color = color;
                this.isAttacking = false;
                this.attackType = 0; // 1 = K (szybki), 2 = L (mocny)
                this.health = 100;
                this.isEnemy = isEnemy;
                this.dead = false;
                this.facingRight = !isEnemy;
            }

            drawStickman() {
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const cx = this.position.x + this.width / 2;
                const cy = this.position.y;

                // Głowa
                if (this.isEnemy && enemyFace.complete) {
                    const faceSize = 60;
                    ctx.drawImage(enemyFace, cx - faceSize / 2, cy - 15, faceSize, faceSize);
                } else {
                    ctx.beginPath();
                    ctx.arc(cx, cy + 20, 15, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Tułów
                ctx.beginPath();
                ctx.moveTo(cx, cy + 35);
                ctx.lineTo(cx, cy + 90);
                ctx.stroke();

                // Nogi
                ctx.beginPath();
                ctx.moveTo(cx, cy + 90);
                ctx.lineTo(cx - 15, cy + 140); 
                ctx.moveTo(cx, cy + 90);
                ctx.lineTo(cx + 15, cy + 140); 
                ctx.stroke();

                // Ręce
                ctx.beginPath();
                const armY = cy + 50;
                let handX = cx + (this.facingRight ? 30 : -30);
                let handY = cy + 60;
                
                if (this.isAttacking) {
                    if (this.attackType === 1) {
                        handX = cx + (this.facingRight ? 50 : -50);
                        handY = cy + 50;
                    } else if (this.attackType === 2) {
                        handX = cx + (this.facingRight ? 60 : -60);
                        handY = cy + 90;
                    }
                }

                ctx.moveTo(cx, armY);
                ctx.lineTo(handX, handY);
                ctx.stroke();

                // Patyk
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 6;
                ctx.beginPath();
                if (this.isAttacking && this.attackType === 2) {
                    ctx.moveTo(handX - (this.facingRight ? 10 : -10), handY - 40);
                    ctx.lineTo(handX + (this.facingRight ? 50 : -50), handY + 40);
                } else if (this.isAttacking && this.attackType === 1) {
                    ctx.moveTo(handX - (this.facingRight ? 30 : -30), handY);
                    ctx.lineTo(handX + (this.facingRight ? 70 : -70), handY);
                } else {
                    ctx.moveTo(handX, handY - 50);
                    ctx.lineTo(handX, handY + 30);
                }
                ctx.stroke();
            }

            update() {
                this.drawStickman();
                
                if (this.dead) return;

                this.attackBox.position.x = this.facingRight ? this.position.x + this.width / 2 : this.position.x + this.width / 2 - this.attackBox.width;
                this.attackBox.position.y = this.position.y + 30;

                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                if (this.position.y + this.height + this.velocity.y >= canvas.height - 50) {
                    this.velocity.y = 0;
                    this.position.y = canvas.height - 50 - this.height;
                } else {
                    this.velocity.y += gravity;
                }

                if (this.position.x < 0) this.position.x = 0;
                if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;
            }

            attack(type) {
                if (this.isAttacking) return;
                this.isAttacking = true;
                this.attackType = type;
                this.attackBox.width = type === 1 ? 120 : 150;
                
                setTimeout(() => {
                    this.isAttacking = false;
                }, type === 1 ? 200 : 400);
            }

            takeHit(damage) {
                this.health -= damage;
                if (this.health <= 0) {
                    this.health = 0;
                    this.dead = true;
                }
            }
        }

        const player = new Sprite({
            position: { x: 200, y: 0 },
            velocity: { x: 0, y: 0 },
            color: '#1e88e5'
        });

        const enemy = new Sprite({
            position: { x: 750, y: 0 },
            velocity: { x: 0, y: 0 },
            color: '#e53935',
            isEnemy: true
        });

        const keys = {
            a: { pressed: false },
            d: { pressed: false },
            w: { pressed: false },
            space: { pressed: false }
        };

        function rectangularCollision({ rectangle1, rectangle2 }) {
            return (
                rectangle1.attackBox.position.x + rectangle1.attackBox.width >= rectangle2.position.x &&
                rectangle1.attackBox.position.x <= rectangle2.position.x + rectangle2.width &&
                rectangle1.attackBox.position.y + rectangle1.attackBox.height >= rectangle2.position.y &&
                rectangle1.attackBox.position.y <= rectangle2.position.y + rectangle2.height
            );
        }

        let gameOver = false;
        function determineWinner() {
            document.getElementById('result').style.display = 'block';
            if (player.health === enemy.health) {
                document.getElementById('result').innerHTML = 'REMIS';
            } else if (player.health > enemy.health) {
                document.getElementById('result').innerHTML = 'GNIAZDO NOSTALGII WYGRYWA!';
            } else {
                document.getElementById('result').innerHTML = 'PRZEGRAŁEŚ!';
            }
            gameOver = true;
        }

        function updateAI() {
            if (enemy.dead || player.dead || gameOver) {
                enemy.velocity.x = 0;
                return;
            }

            const distanceX = player.position.x - enemy.position.x;
            enemy.facingRight = distanceX > 0;

            if (Math.abs(distanceX) > 100) {
                enemy.velocity.x = distanceX > 0 ? 3 : -3;
            } else {
                enemy.velocity.x = 0;
            }

            if (Math.random() < 0.02 && enemy.velocity.y === 0) {
                enemy.velocity.y = -15;
            }

            if (Math.abs(distanceX) < 130 && !enemy.isAttacking) {
                if (Math.random() < 0.05) {
                    enemy.attack(Math.random() > 0.5 ? 1 : 2);
                }
            }
        }

        function animate() {
            if (gameOver) return;
            window.requestAnimationFrame(animate);

            ctx.fillStyle = '#e0e0e0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#9e9e9e';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            player.update();
            enemy.update();

            player.facingRight = player.position.x < enemy.position.x;
            if(!enemy.isEnemy) enemy.facingRight = enemy.position.x < player.position.x;

            player.velocity.x = 0;
            if (keys.a.pressed && player.lastKey === 'a') {
                player.velocity.x = -5;
            } else if (keys.d.pressed && player.lastKey === 'd') {
                player.velocity.x = 5;
            }

            updateAI();

            if (player.isAttacking && rectangularCollision({ rectangle1: player, rectangle2: enemy })) {
                player.isAttacking = false;
                enemy.takeHit(player.attackType === 1 ? 5 : 15);
                document.getElementById('enemyHealth').style.width = enemy.health + '%';
            }

            if (enemy.isAttacking && rectangularCollision({ rectangle1: enemy, rectangle2: player })) {
                enemy.isAttacking = false;
                player.takeHit(enemy.attackType === 1 ? 5 : 15);
                document.getElementById('playerHealth').style.width = player.health + '%';
            }

            if (enemy.health <= 0 || player.health <= 0) {
                determineWinner();
            }
        }

        animate();

        window.addEventListener('keydown', (event) => {
            if (player.dead || gameOver) return;

            switch (event.key.toLowerCase()) {
                case 'd':
                    keys.d.pressed = true;
                    player.lastKey = 'd';
                    break;
                case 'a':
                    keys.a.pressed = true;
                    player.lastKey = 'a';
                    break;
                case 'w':
                case ' ':
                    if (player.velocity.y === 0) player.velocity.y = -15;
                    break;
                case 'k':
                    player.attack(1);
                    break;
                case 'l':
                    player.attack(2);
                    break;
            }
        });

        window.addEventListener('keyup', (event) => {
            switch (event.key.toLowerCase()) {
                case 'd':
                    keys.d.pressed = false;
                    break;
                case 'a':
                    keys.a.pressed = false;
                    break;
            }
        });
    </script>
</body>
</html>
